name: Build OpenAlice Linux Package

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update && apt-get install -y g++-8 make wget unzip libsfml-dev build-essential

      - name: Fix Makefile and Build
        run: |
          cd build_ubuntu_20
          
          # Corregir comandos incompatibles y rutas de SFML
          sed -i 's/del /rm -f /g' Makefile
          sed -i 's|~/Downloads/SFML-2.5.1/include|/usr/include|g' Makefile
          sed -i 's|~/Downloads/SFML-2.5.1/lib|/usr/lib/x86_64-linux-gnu|g' Makefile

          # Compilar el juego
          make

      - name: Package Game with All Resources
        run: |
          mkdir -p open_alice_release
          
          # Copilar ejecutable
          cp build_ubuntu_20/alice_game open_alice_release/
          
          # Copiar todas las carpetas multimedia y de datos necesarias
          [ -d "sprites" ] && cp -r sprites open_alice_release/
          [ -d "music" ] && cp -r music open_alice_release/
          [ -d "saves" ] && cp -r saves open_alice_release/
          
          # Crear un archivo ZIP con todo el contenido
          apt-get install -y zip
          zip -r OpenAlice-Linux-Package.zip open_alice_release/
          
          mkdir -p final_output
          mv OpenAlice-Linux-Package.zip final_output/
          ls -la final_output/

      - name: Upload Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenAlice-Complete-Package
          path: final_output/
          if-no-files-found: error
