name: Build OpenAlice Linux Port

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update && apt-get install -y g++-8 make wget unzip libsfml-dev build-essential

      - name: Fix Makefile and Build
        run: |
          cd build_ubuntu_20
          
          # Reemplazar comando 'del' por 'rm -f' compatible con Linux
          sed -i 's/del /rm -f /g' Makefile
          
          # Apuntar las rutas de SFML a las librerías instaladas en el sistema
          sed -i 's|~/Downloads/SFML-2.5.1/include|/usr/include|g' Makefile
          sed -i 's|~/Downloads/SFML-2.5.1/lib|/usr/lib/x86_64-linux-gnu|g' Makefile

          # Compilar el proyecto
          make

      - name: Collect Binary
        run: |
          mkdir -p final_output
          cp build_ubuntu_20/alice_game final_output/
          ls -la final_output/

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenAlice-Linux-Binary
          path: final_output/
          if-no-files-found: error
