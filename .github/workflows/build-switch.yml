name: Build Nintendo Switch Port

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies and SFML
        run: |
          apt-get update && apt-get install -y g++ build-essential wget unzip libsfml-dev || true
          ln -sf /usr/bin/g++ /usr/bin/g++-8
          ln -sf /usr/bin/gcc /usr/bin/gcc-8
          export PATH=/opt/devkitpro/pacman/bin:$PATH
          dkp-pacman -Syu --noconfirm switch-dev libnx switch-sdl2 switch-sdl2_image switch-sdl2_mixer switch-sdl2_ttf switch-sfml || pacman -Syu --noconfirm switch-dev libnx switch-sdl2 switch-sdl2_image switch-sdl2_mixer switch-sdl2_ttf || true

      - name: Build inside build_ubuntu_20 with target switch
        run: |
          export PATH=/opt/devkitpro/devkitA64/bin:$PATH
          cd build_ubuntu_20
          make switch || make platform=switch || make

      - name: Find and Collect Executables
        run: |
          mkdir -p final_output
          echo "=== TODOS LOS ARCHIVOS CREADOS RECIENTEMENTE ==="
          find . -maxdepth 4 -mmin -10 -not -path '*/.*'
          
          # Copiar cualquier archivo ejecutable o relevante
          find . -type f \( -name "*.nro" -o -name "*.elf" -o -name "*.nacp" -o -name "openalice*" \) -exec cp {} final_output/ \;
          ls -la final_output/

      - name: Upload NRO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenAlice-Switch
          path: final_output/
          if-no-files-found: warn
