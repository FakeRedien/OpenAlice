name: Build Nintendo Switch Port

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies via pacman
        run: |
          export PATH=/opt/devkitpro/pacman/bin:$PATH
          dkp-pacman -Syu --noconfirm switch-dev libnx switch-sdl2 switch-sdl2_image switch-sdl2_mixer switch-sdl2_ttf || pacman -Syu --noconfirm switch-dev libnx switch-sdl2 switch-sdl2_image switch-sdl2_mixer switch-sdl2_ttf

      - name: Build inside build_ubuntu_20
        run: |
          export PATH=/opt/devkitpro/devkitA64/bin:$PATH
          cd build_ubuntu_20
          make

      - name: Prepare Artifacts Directory
        run: |
          mkdir -p output_nro
          find . -name "*.nro" -exec cp {} output_nro/ \;
          find . -name "*.elf" -exec cp {} output_nro/ \;

      - name: Upload NRO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenAlice-Switch
          path: output_nro/
          if-no-files-found: warn
