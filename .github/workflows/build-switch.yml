name: Build Nintendo Switch Port

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Switch Environment
        run: |
          export PATH=/opt/devkitpro/pacman/bin:$PATH
          dkp-pacman -Syu --noconfirm switch-dev libnx switch-sdl2 switch-sdl2_image switch-sdl2_ttf || pacman -Syu --noconfirm switch-dev libnx switch-sdl2 switch-sdl2_image switch-sdl2_ttf || true

      - name: Compile for Nintendo Switch
        run: |
          export PATH=/opt/devkitpro/devkitA64/bin:/opt/devkitpro/tools/bin:$PATH
          cd build_ubuntu_20
          
          # Configurar variables de compilación para devKitPro A64
          export CXX=aarch64-none-elf-g++
          export CC=aarch64-none-elf-gcc
          export LD=aarch64-none-elf-g++
          
          # Intentar compilar los objetos con flags de libnx
          make CXX=aarch64-none-elf-g++ CC=aarch64-none-elf-gcc CXXFLAGS="-O3 -g -Wall -Wextra -std=c++17 -march=armv8-a+crc+crypto -mtune=cortex-a57 -ftree-vectorize -fPIE -I/opt/devkitpro/libnx/include" || true
          
          # Generar NRO si existe un ELF válido
          mkdir -p ../final_output
          if [ -f "alice_game" ]; then
            # Si el binario generado es ELF de ARM64, lo convertimos directamente
            aarch64-none-elf-strip alice_game -o ../final_output/open_alice.elf || cp alice_game ../final_output/open_alice.elf
            elf2nro ../final_output/open_alice.elf ../final_output/open_alice.nro || true
          fi
          
          ls -la ../final_output/

      - name: Upload NRO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenAlice-Switch
          path: final_output/
          if-no-files-found: warn
