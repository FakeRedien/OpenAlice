name: Build Nintendo Switch Port

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Switch Dependencies
        run: |
          export PATH=/opt/devkitpro/pacman/bin:$PATH
          dkp-pacman -Syu --noconfirm switch-dev libnx switch-sdl2 switch-sdl2_image switch-sdl2_ttf switch-sdl2_mixer || pacman -Syu --noconfirm switch-dev libnx switch-sdl2 switch-sdl2_image switch-sdl2_ttf switch-sdl2_mixer || true

      - name: Create Switch Makefile and Build
        run: |
          export PATH=/opt/devkitpro/devkitA64/bin:/opt/devkitpro/tools/bin:$PATH
          
          # Crear el Makefile optimizado para Nintendo Switch
          cat << 'MAKEOFF' > Makefile.switch
          TARGET		:= open_alice
          SOURCES		:= code code/screens code/screens/subscreens code/tests
          INCLUDES	:= code /opt/devkitpro/libnx/include
          LIBS		:= -lswitch-sdl2_image -lswitch-sdl2_ttf -lswitch-sdl2_mixer -lswitch-sdl2 -lEGL -lglapi -ldamagent -lnx -lm

          PREFIX		:= aarch64-none-elf-
          CC		:= $(PREFIX)gcc
          CXX		:= $(PREFIX)g++
          LD		:= $(PREFIX)g++
          STRIP		:= $(PREFIX)strip
          ELF2NRO		:= elf2nro

          ARCH		:= -march=armv8-a+crc+crypto -mtune=cortex-a57 -ftree-vectorize -fPIE

          CFLAGS		:= -g -Wall -O3 -ffunction-sections $(ARCH) $(foreach dir,$(INCLUDES),-I$(dir))
          CXXFLAGS	:= $(CFLAGS) -std=c++17 -D__SWITCH__ -DSDLSWITCH
          LDFLAGS		:= -specs=/opt/devkitpro/libnx/switch.specs -g $(ARCH) -Wl,--gc-sections

          CPPFILES	:= $(foreach dir,$(SOURCES),$(wildcard $(dir)/*.cpp))
          CFILES		:= $(foreach dir,$(SOURCES),$(wildcard $(dir)/*.c))
          OFILES		:= $(notdir $(CPPFILES:.cpp=.o) $(CFILES:.c=.o))

          VPATH		:= $(SOURCES)

          all: $(TARGET).nro

          $(TARGET).nro: $(TARGET).elf
          	$(ELF2NRO) $< $@

          $(TARGET).elf: $(OFILES)
          	$(LD) $(LDFLAGS) $(OFILES) $(LIBS) -o $@
          	$(STRIP) -s $@

          %.o: %.cpp
          	$(CXX) $(CXXFLAGS) -c $< -o $@

          %.o: %.c
          	$(CC) $(CFLAGS) -c $< -o $@

          clean:
          	rm -f *.o $(TARGET).elf $(TARGET).nro
          MAKEOFF

          # Ejecutar la compilación para la Switch
          make -f Makefile.switch

          # Preparar la salida
          mkdir -p final_output
          cp open_alice.nro final_output/
          cp open_alice.elf final_output/
          ls -la final_output/

      - name: Upload Switch NRO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenAlice-Switch-NRO
          path: final_output/
          if-no-files-found: error
