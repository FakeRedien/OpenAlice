name: Build Nintendo Switch Port

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup devKitPro
        uses: devkitPro/setup-devkitpro-action@v1

      - name: Install dependencies
        run: |
          dkp-pacman -Syu --noconfirm switch-dev libnx switch-sdl2 switch-sdl2_image switch-sdl2_mixer switch-sdl2_ttf

      - name: Build Nintendo Switch NRO
        run: |
          source /etc/profile.d/devkit-env.sh
          make -f build_ubuntu_20/Makefile || true
          find . -name "*.nro"

      - name: Upload NRO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenAlice-Switch
          path: |
            *.nro
            **/*.nro
            build*/**/*.nro
