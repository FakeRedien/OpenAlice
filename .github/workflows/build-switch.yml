name: Build Native Nintendo Switch Port

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Switch Dependencies
        run: |
          export PATH=/opt/devkitpro/pacman/bin:$PATH
          dkp-pacman -Syu --noconfirm switch-dev libnx switch-sdl2 switch-sdl2_image switch-sdl2_ttf switch-sdl2_mixer || pacman -Syu --noconfirm switch-dev libnx switch-sdl2 switch-sdl2_image switch-sdl2_ttf switch-sdl2_mixer || true

      - name: Patch Source Files for Switch / SDL2 Compatibility
        run: |
          # Reemplazar los includes de SFML por las adaptaciones o SDL2 en todos los archivos .cpp y .h
          find code/ -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.hpp" \) -exec sed -i 's|#include <SFML/Graphics.hpp>|#include <SDL2/SDL.h>\n#include <SDL2/SDL_image.h>|g' {} +
          find code/ -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.hpp" \) -exec sed -i 's|#include <SFML/Window.hpp>|#include <SDL2/SDL.h>|g' {} +
          find code/ -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.hpp" \) -exec sed -i 's|#include <SFML/System.hpp>|#include <SDL2/SDL.h>|g' {} +
          find code/ -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.hpp" \) -exec sed -i 's|#include <SFML/Audio.hpp>|#include <SDL2/SDL_mixer.h>|g' {} +

      - name: Create Switch Makefile and Build
        run: |
          export PATH=/opt/devkitpro/devkitA64/bin:/opt/devkitpro/tools/bin:$PATH
          
          cat << 'MAKEOFF' > Makefile.switch
          TARGET		:= open_alice
          SOURCES		:= code code/screens code/screens/subscreens code/tests
          INCLUDES	:= code /opt/devkitpro/libnx/include /opt/devkitpro/portlibs/switch/include
          LIBS		:= -lswitch-sdl2_image -lswitch-sdl2_ttf -lswitch-sdl2_mixer -lswitch-sdl2 -lEGL -lglapi -ldamagent -lnx -lm
          LIBDIRS		:= /opt/devkitpro/portlibs/switch/lib

          PREFIX		:= aarch64-none-elf-
          CC		:= $(PREFIX)gcc
          CXX		:= $(PREFIX)g++
          LD		:= $(PREFIX)g++
          STRIP		:= $(PREFIX)strip
          ELF2NRO		:= elf2nro

          ARCH		:= -march=armv8-a+crc+crypto -mtune=cortex-a57 -ftree-vectorize -fPIE

          CFLAGS		:= -g -Wall -O3 -ffunction-sections $(ARCH) $(foreach dir,$(INCLUDES),-I$(dir))
          CXXFLAGS	:= $(CFLAGS) -std=c++17 -D__SWITCH__ -DSDLSWITCH
          LDFLAGS		:= -specs=/opt/devkitpro/libnx/switch.specs -g $(ARCH) -Wl,--gc-sections $(foreach dir,$(LIBDIRS),-L$(dir))

          CPPFILES	:= $(foreach dir,$(SOURCES),$(wildcard $(dir)/*.cpp))
          CFILES		:= $(foreach dir,$(SOURCES),$(wildcard $(dir)/*.c))
          OFILES		:= $(notdir $(CPPFILES:.cpp=.o) $(CFILES:.c=.o))

          VPATH		:= $(SOURCES)

          all: $(TARGET).nro

          $(TARGET).nro: $(TARGET).elf
          	$(ELF2NRO) $< $@

          $(TARGET).elf: $(OFILES)
          	$(LD) $(LDFLAGS) $(OFILES) $(LIBS) -o $@
          	$(STRIP) -s $@

          %.o: %.cpp
          	$(CXX) $(CXXFLAGS) -c $< -o $@

          %.o: %.c
          	$(CC) $(CFLAGS) -c $< -o $@

          clean:
          	rm -f *.o $(TARGET).elf $(TARGET).nro
          MAKEOFF

          make -f Makefile.switch

      - name: Organize Game Folder Structure
        run: |
          mkdir -p switch_release/open_alice
          cp open_alice.nro switch_release/open_alice/
          [ -d "sprites" ] && cp -r sprites switch_release/open_alice/
          [ -d "music" ] && cp -r music switch_release/open_alice/
          [ -d "saves" ] && cp -r saves switch_release/open_alice/
          [ -d "code" ] && cp -r code switch_release/open_alice/
          ls -la switch_release/open_alice/

      - name: Upload Switch NRO Package
        uses: actions/upload-artifact@v4
        with:
          name: OpenAlice-Switch-Native
          path: switch_release/
          if-no-files-found: error
