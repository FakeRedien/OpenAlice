name: Build Nintendo Switch Port

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies via pacman
        run: |
          export PATH=/opt/devkitpro/pacman/bin:$PATH
          dkp-pacman -Syu --noconfirm switch-dev libnx switch-sdl2 switch-sdl2_image switch-sdl2_mixer switch-sdl2_ttf || pacman -Syu --noconfirm switch-dev libnx switch-sdl2 switch-sdl2_image switch-sdl2_mixer switch-sdl2_ttf

      - name: Inspect Makefile and Build
        run: |
          export PATH=/opt/devkitpro/devkitA64/bin:$PATH
          echo "=== CONTENIDO DEL MAKEFILE ==="
          cat build_ubuntu_20/Makefile
          echo "=== EJECUTANDO MAKE ==="
          make -f build_ubuntu_20/Makefile || make || true
          echo "=== BUSCANDO ARCHIVOS GENERADOS ==="
          find . -maxdepth 4 -not -path '*/.*'

      - name: Upload All Workspace Files as Debug
        uses: actions/upload-artifact@v4
        with:
          name: OpenAlice-Debug-Files
          path: |
            *
            */*
            */*/*
          if-no-files-found: ignore
