name: Build Nintendo Switch Port

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Switch Environment
        run: |
          export PATH=/opt/devkitpro/pacman/bin:$PATH
          dkp-pacman -Syu --noconfirm switch-dev libnx switch-sdl2 switch-sdl2_image switch-sdl2_ttf || pacman -Syu --noconfirm switch-dev libnx switch-sdl2 switch-sdl2_image switch-sdl2_ttf || true

      - name: Compile and Show Errors
        run: |
          export PATH=/opt/devkitpro/devkitA64/bin:/opt/devkitpro/tools/bin:$PATH
          cd build_ubuntu_20
          
          # Limpiar compilaciones anteriores
          make clean || true
          
          # Intentar compilar mostrando la salida completa para depurar
          make CXX=aarch64-none-elf-g++ CC=aarch64-none-elf-gcc

      - name: Upload NRO Artifact if exists
        uses: actions/upload-artifact@v4
        with:
          name: OpenAlice-Switch
          path: |
            build_ubuntu_20/*.nro
            build_ubuntu_20/*.elf
            build_ubuntu_20/alice_game
          if-no-files-found: warn
